<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Random Number Generator</h1>
      <div class="inputs">
        <label>Min: <input type="number" id="minInput" value="1" /></label>
        <label>Max: <input type="number" id="maxInput" value="100" /></label>
      </div>
      <button id="generateBtn">Generate</button>
      <h2 id="result"></h2>
      <p id="errorMsg"></p>
    </div>
    <script src="index.js"></script>
  </body>
</html>
