<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <form class = "weatherform">
        <input type = "text" class = "cityInput" placeholder ="Enter City" >
        <button type = "submit" onclick = submit()> Check Weather</button>
    </form>
    <div class = "display">
        <h1 class = "name">Dallas</h1>
        <h2 class = "temp">Temperature: 40&deg;C</h2>
        <p class = "humidity">Humidity: 63%</p>
        <p class = "sky">Clear</p>
        <p id = "emoji">☀️</p>
        <p class = "error"></p>
        
    </div>
    <script src="index.js"></script>
  </body>
</html>
